<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>הדפסת קודי QR</title>
  <link rel="stylesheet" href="/Treasury/styles.css">
</head>
<body>
  <main class="print-page">
    <h1>קודי QR למשחק הפעיל - הדפסה בגודל 100%</h1>
    <section id="cut-grid" class="cut-grid" aria-label="קודי QR להדפסה"></section>
  </main>
  <script>
    const basePath = "/Treasury";
    fetch(`${basePath}/data.json?ts=${Date.now()}`, { cache: "no-store" })
      .then(response => response.json())
      .then(config => {
        const grid = document.querySelector("#cut-grid");
        config.rows
          .filter(row => row.game === config.activeGame)
          .sort((a, b) => a.order - b.order)
          .forEach(row => {
            const card = document.createElement("article");
            card.className = "cut-card";
            const image = document.createElement("img");
            image.src = `https://api.qrserver.com/v1/create-qr-code/?size=560x560&format=svg&margin=20&data=${encodeURIComponent(row.pageUrl)}`;
            image.alt = `QR עבור ${row.englishName}`;
            const title = document.createElement("h2");
            title.textContent = row.englishName;
            const base = document.createElement("p");
            base.textContent = "zafrirz.github.io/Treasury/";
            const slug = document.createElement("p");
            slug.textContent = row.slug;
            card.append(image, title, base, slug);
            grid.append(card);
          });
        if (new URLSearchParams(location.search).has("print")) setTimeout(() => window.print(), 500);
      });
  </script>
</body>
</html>
